services:
  app:
    build: .
    image: sabores-en-casa
    container_name: sabores-en-casa
    restart: unless-stopped
    ports:
      - "8000:80"
    env_file:
      - .env
    environment:
      DB_CONNECTION: sqlite
      DB_DATABASE: /var/www/html/data/database.sqlite
    volumes:
      - db-data:/var/www/html/data
      - app-storage:/var/www/html/storage

volumes:
  db-data:
  app-storage:
